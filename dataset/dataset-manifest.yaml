creation_methodology: "OFBiz pinned read-only at 24.09.07 with explicit order scope; fictional Meridian Retail Group defined; 20 titles fixed across 4 types; bodies written against identifiers verified in outputs-deps/order-facts.jsonl; out-of-scope refs labeled UNRESOLVED; ambiguities and unsupported claims planted deliberately; deterministic generator (scripts/build_synthetic_corpus.py)."
ground_truth_methodology: "Facts record statement, subject/predicate/object, support_type DIRECT/INDIRECT/SYNTHETIC/UNRESOLVED, OFBiz file+location where applicable, and honesty notes. Negatives record why_unsupported plus expected UNSUPPORTED/NOT_FOUND/PARTIALLY_SUPPORTED."
ofbiz_scope: "applications/order plus applications/datamodel/entitydef/order-entitymodel.xml; 467 services, 112 base entities, 55 views, 567 relations, 111 ECAs, 10204 facts, 117788 triples; SHACL 0 violations."
limitations:
  - "Synthetic business content only; thresholds, timers, roles, codes fictional."
  - "OFBiz linkage limited to order scope; product/party masters unresolved by design."
  - "Java/Groovy bodies unparsed; implementedBy source-stated only."
  - "Business meaning not yet evaluated (probabilistic layer future work)."
license_notes: "Apache OFBiz under Apache License 2.0 (see LICENSES_AND_SOURCES.md). Synthetic corpus is original fictional research content. No real personal data."
