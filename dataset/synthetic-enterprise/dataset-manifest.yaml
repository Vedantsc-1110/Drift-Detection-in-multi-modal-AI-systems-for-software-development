creation_methodology: "Fictional org defined first; 20 titles fixed; bodies written against verified OFBiz identifiers (outputs-deps/order-facts.jsonl, 2026-09-22); out-of-scope refs labeled; ambiguities planted; generator scripts/build_synthetic_corpus.py is deterministic."
ground_truth_methodology: "Each fact records statement, subject/predicate/object, support_type (DIRECT/INDIRECT/SYNTHETIC/UNRESOLVED), OFBiz file+location where applicable, and an honesty note. Business readings over real artifacts are INDIRECT, never DIRECT. Negatives specify why_unsupported plus expected UNSUPPORTED/NOT_FOUND/PARTIALLY_SUPPORTED."
ofbiz_scope: "applications/order plus applications/datamodel/entitydef/order-entitymodel.xml (467 services, 112 base entities, 55 views, 567 relations, 111 ECAs, 10204 facts, 117788 triples)."
limitations:
