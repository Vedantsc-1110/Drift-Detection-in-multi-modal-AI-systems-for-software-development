  - "OFBiz linkage limited to the order plus order-entitymodel.xml scope; product/party masters unresolved by design."
  - "Word counts vary (~340-880 per doc); tables and appendices render to approximately 2 pages in DOCX."
  - "No real personal data; no real company affiliation."
license_notes: "Synthetic corpus is original fictional content for research evaluation. OFBiz portions remain under the Apache License 2.0 (see dataset LICENSES_AND_SOURCES.md)."
