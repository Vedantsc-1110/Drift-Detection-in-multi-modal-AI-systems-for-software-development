# Part 1 deterministic evaluation — fixed question set (v1).
# Gold truth grounded in dataset/apache-ofbiz-24.09.07 (read-only).
# Scope: component `order` + explicit dependency
#   applications/datamodel/entitydef/order-entitymodel.xml
# Do NOT invent answers from general knowledge. Every expected value below was
# read from the actual XML sources listed in `source_files`.
# Check types drive src/contextgraph/evaluate.py (deterministic, no LLM).
questions:
  - id: Q-COMP-001
    category: component
    check: component_name
    question: "What component is being analyzed?"
    expected_answer:
      component: order
    source_files:
      - applications/order/ofbiz-component.xml
    source_locations:
      - xpath: /ofbiz-component[@name='order']
    expected_fact_type: DIRECT
    evaluation_notes: "Component node must exist with ofbiz:name 'order' and definedIn order/ofbiz-component.xml."

  - id: Q-COMP-002
    category: component
    check: scope_components
    question: "Which source/datamodel components are included in the current extraction scope?"
    expected_answer:
      components:
        - datamodel
        - order
      dependency_files:
        - applications/datamodel/entitydef/order-entitymodel.xml
        - applications/datamodel/ofbiz-component.xml
      include_dependencies: true
    source_files:
      - applications/order/ofbiz-component.xml
      - applications/datamodel/ofbiz-component.xml
      - applications/datamodel/entitydef/order-entitymodel.xml
    source_locations:
      - file: applications/datamodel/ofbiz-component.xml
        xpath: /ofbiz-component[@name='datamodel']
    expected_fact_type: DIRECT
    evaluation_notes: "Manifest scope.include_dependencies must be true; both Component nodes must exist in graph."

  - id: Q-SVC-001
    category: service
    check: service_description
    question: "What is the purpose/description of storeOrder?"
    expected_answer:
      service: storeOrder
      description: "Creates order entities"
    source_files:
      - applications/order/servicedef/services.xml
    source_locations:
      - file: applications/order/servicedef/services.xml
        line: 108
        xpath: /services/service[10]
        child: description
    expected_fact_type: DIRECT
    evaluation_notes: "Verbatim <description> text; never paraphrased."

  - id: Q-SVC-002
    category: service
    check: service_implementation
    question: "What implements storeOrder according to the service definition?"
    expected_answer:
      service: storeOrder
      engine: java
      implementation_class: org.apache.ofbiz.order.order.OrderServices
      method: createOrder
    source_files:
      - applications/order/servicedef/services.xml
    source_locations:
      - file: applications/order/servicedef/services.xml
        line: 108
        xpath: /services/service[10]
    expected_fact_type: DIRECT
    evaluation_notes: "Source-stated binding only (location+invoke). NOT verified against Java bodies in Part 1."

  - id: Q-SVC-003
    category: service
    check: service_inputs
    question: "What are the inputs of storeOrder?"
    expected_answer:
      service: storeOrder
      # 56 IN/INOUT params, verbatim from services.xml service[10].
      inputs:
        - affiliateId
        - agreementId
        - autoOrderShoppingListId
        - billFromVendorPartyId
        - billToCustomerPartyId
        - billingAccountId
        - currencyUom
        - distributorId
        - endUserCustomerPartyId
        - externalId
        - firstAttemptOrderId
        - grandTotal
        - internalCode
        - isRushOrder
        - orderAdditionalPartyRoleMap
        - orderAdjustments
        - orderAttributes
        - orderContactMechs
        - orderDate
        - orderId
        - orderInternalNotes
        - orderItemAssociations
        - orderItemAttributes
        - orderItemContactMechs
        - orderItemGroups
        - orderItemPriceInfos
        - orderItemShipGroupInfo
        - orderItemSurveyResponses
        - orderItems
        - orderName
        - orderNotes
        - orderPaymentInfo
        - orderProductPromoCodes
        - orderProductPromoUses
        - orderTerms
        - orderTypeId
        - originFacilityId
        - originOrderId
        - partyId
        - placingCustomerPartyId
        - priority
        - productStoreId
        - salesChannelEnumId
        - shipFromVendorPartyId
        - shipToCustomerPartyId
        - shippingAmount
        - supplierAgentPartyId
        - supplierPartyId
        - taxAmount
        - terminalId
        - trackingCodeOrders
        - transactionId
        - visitId
        - webSiteId
        - workEffortId
        - workEfforts
      count: 56
    source_files:
      - applications/order/servicedef/services.xml
    source_locations:
      - file: applications/order/servicedef/services.xml
        line: 108
        xpath: /services/service[10]
    expected_fact_type: DIRECT
    evaluation_notes: "Structured set comparison on hasInput param names (attribute-mode, direct). Order-insensitive."

  - id: Q-SVC-004
    category: service
    check: service_outputs
    question: "What are the outputs of storeOrder?"
    expected_answer:
      service: storeOrder
      outputs:
        - orderId
        - orderTypeId
        - statusId
      count: 3
    source_files:
      - applications/order/servicedef/services.xml
    source_locations:
      - file: applications/order/servicedef/services.xml
        line: 108
        xpath: /services/service[10]
    expected_fact_type: DIRECT
    evaluation_notes: "OUT/INOUT params via hasOutput (attribute-mode, direct). orderTypeId+orderId are INOUT (both)."

  - id: Q-DATA-001
    category: entity
    check: entity_exists
    question: "Does OrderHeader exist as a BASE entity?"
    expected_answer:
      entity: OrderHeader
      kind: Entity
      is_base: true
    source_files:
      - applications/datamodel/entitydef/order-entitymodel.xml
    source_locations:
      - file: applications/datamodel/entitydef/order-entitymodel.xml
        line: 418
        xpath: /entitymodel/entity[16]
    expected_fact_type: DIRECT
    evaluation_notes: "Must be rdf:type ofbiz:Entity (not ViewEntity). definedIn order-entitymodel.xml."

  - id: Q-DATA-002
    category: entity
    check: entity_pk
    question: "What are the primary key fields of OrderHeader?"
    expected_answer:
      entity: OrderHeader
      primary_keys:
        - orderId
    source_files:
      - applications/datamodel/entitydef/order-entitymodel.xml
    source_locations:
      - file: applications/datamodel/entitydef/order-entitymodel.xml
        line: 419
        xpath: /entitymodel/entity[16]/field[1]
    expected_fact_type: DIRECT
    evaluation_notes: "Normalized set comparison on isPrimaryKey=true attributes."

  - id: Q-DATA-003
    category: entity
    check: entity_exists
    question: "Does OrderItem exist as a BASE entity?"
    expected_answer:
      entity: OrderItem
      kind: Entity
      is_base: true
    source_files:
      - applications/datamodel/entitydef/order-entitymodel.xml
    source_locations:
      - file: applications/datamodel/entitydef/order-entitymodel.xml
        xpath: /entitymodel/entity[@entity-name='OrderItem']
    expected_fact_type: DIRECT
    evaluation_notes: "Base vs view must not be confused. OrderItem is <entity>, not <view-entity>."

  - id: Q-DATA-004
    category: relation
    check: entity_relations
    question: "What relationships connect relevant Order entities (OrderHeader subject)?"
    expected_answer:
      subject: OrderHeader
      # Resolved subset: targets defined in order-entitymodel.xml (in scope).
      resolved_relations:
        - target: OrderType
          type: one
          fk_name: ORDER_HDR_TYPE
        - target: OrderTypeAttr
          type: many
        - target: ShoppingList
          type: one
          fk_name: ORDER_HDR_AOSHLST
      # Known out-of-scope targets for this subject (must be unresolved, not edged).
      unresolved_targets:
        - Enumeration
        - Facility
        - BillingAccount
        - ProductStore
        - UserLogin
        - StatusItem
        - Uom
        - WebSite
    source_files:
      - applications/datamodel/entitydef/order-entitymodel.xml
    source_locations:
      - file: applications/datamodel/entitydef/order-entitymodel.xml
        line: 450
        xpath: /entitymodel/entity[16]/relation[1]
    expected_fact_type: DIRECT
    evaluation_notes: "Compare Relation nodes + relationTo triples for resolved; unresolved via dangling report. PARTIAL if subset."

  - id: Q-ECA-001
    category: eca
    check: eca_behavior
    question: "What happens when OrderHeader is created (create-store, return) with statusId=ORDER_COMPLETED and needsInventoryIssuance=Y?"
    expected_answer:
      trigger_entity: OrderHeader
      operation: create-store
      event: return
      conditions:
        - field: statusId
          operator: equals
          value: ORDER_COMPLETED
        - field: needsInventoryIssuance
          operator: equals
          value: Y
      action_service: issueImmediatelyFulfilledOrder
      action_mode: sync
    source_files:
      - applications/order/entitydef/eecas.xml
    source_locations:
      - file: applications/order/entitydef/eecas.xml
        line: 24
        xpath: /entity-eca/eca[1]
      - file: applications/order/entitydef/eecas.xml
        line: 27
        xpath: /entity-eca/eca[1]/action
    expected_fact_type: DIRECT
    evaluation_notes: "ECA+conditions are DIRECT and resolved; action target is outside scope so full behavior is UNRESOLVED."

  - id: Q-ECA-002
    category: eca
    check: eca_identify
    question: "Which ECA rule represents the OrderHeader create-store behavior?"
    expected_answer:
      trigger_entity: OrderHeader
      operation: create-store
      event: return
      eca_class: EntityECA
    source_files:
      - applications/order/entitydef/eecas.xml
    source_locations:
      - file: applications/order/entitydef/eecas.xml
        line: 24
        xpath: /entity-eca/eca[1]
    expected_fact_type: DIRECT
    evaluation_notes: "EntityECA node with triggerEntityName=OrderHeader, ecaOperation=create-store, ecaEvent=return."

  - id: Q-ECA-003
    category: eca
    check: eca_action
    question: "Which service does the OrderHeader ECA action reference?"
    expected_answer:
      action_service: issueImmediatelyFulfilledOrder
      defined_in: applications/product/servicedef/services_facility.xml
      in_scope: false
    source_files:
      - applications/order/entitydef/eecas.xml
      - applications/product/servicedef/services_facility.xml
    source_locations:
      - file: applications/order/entitydef/eecas.xml
        line: 27
        xpath: /entity-eca/eca[1]/action
    expected_fact_type: UNRESOLVED
    evaluation_notes: "Reference is stated in eecas.xml but target Service is outside order+datamodel scope: UNRESOLVED, never minted."

  - id: Q-PROV-001
    category: provenance
    check: provenance
    question: "Can the graph provide source evidence for the storeOrder service fact?"
    expected_answer:
      service: storeOrder
      file: applications/order/servicedef/services.xml
      line: 108
      xpath: /services/service[10]
      extraction_type: direct
    source_files:
      - applications/order/servicedef/services.xml
    source_locations:
      - file: applications/order/servicedef/services.xml
        line: 108
        xpath: /services/service[10]
    expected_fact_type: DIRECT
    evaluation_notes: "Verify definedIn artifact + evidenceLine + sourceXPath + extractionType + sha256."

  - id: Q-SCOPE-001
    category: scope
    check: unresolved
    question: "Which known dependencies remain unresolved because they are outside the current scope?"
    expected_answer:
      # Each must appear in unresolved report with evidence and must NOT have a graph node.
      unresolved_targets:
        - name: issueImmediatelyFulfilledOrder
          kind: service
          via: eca-action
        - name: AccommodationSpot
          kind: entity
        - name: ItemIssuance
          kind: entity
        - name: CommunicationEvent
          kind: entity
        - name: StatusItem
          kind: entity
    source_files:
      - applications/order/entitydef/eecas.xml
      - applications/order/servicedef/services_requirement.xml
      - applications/order/servicedef/services_reservations.xml
    source_locations:
      - file: applications/order/entitydef/eecas.xml
        line: 27
        xpath: /entity-eca/eca[1]/action
    expected_fact_type: UNRESOLVED
    evaluation_notes: "System must know the reference exists (dangling report + source) without hallucinating the entity/service."
